name: Package macOS release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refuse duplicate release versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id")"
          if [ -n "$EXISTING" ]; then
            echo "::error::Release v${VERSION} already exists. Bump the version; never replace published assets."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Native updater fixture test
        run: node tests/updater-mac.cjs
      - name: Package and verify ad-hoc signature
        run: bash scripts/package-release.sh
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v${VERSION}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "AI Credit Checker ${VERSION}" --notes-file "docs/RELEASE-${VERSION}.md" --draft
          gh release upload "$TAG" "dist/AI-Credit-Checker-${VERSION}-macOS-arm64.zip" dist/SHA256SUMS.txt
          gh release edit "$TAG" --draft=false --latest
