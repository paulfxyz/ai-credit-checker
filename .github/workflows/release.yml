name: Package macOS release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package and verify ad-hoc signature
        run: bash scripts/package-release.sh
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v${VERSION}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "AI Credit Checker ${VERSION}" --notes-file "docs/RELEASE-${VERSION}.md" --draft
          gh release upload "$TAG" "dist/AI-Credit-Checker-${VERSION}-macOS-arm64.zip" dist/SHA256SUMS.txt
          gh release edit "$TAG" --draft=false --latest
